:root{
  --ink:#0d0e0f;--ink-2:#141618;--line:#262a2d;--steel:#8d9296;--silver:#c4c7c9;--fg:#ecebe7;--gold:#dd900f;--gold-hi:#f0a83a;--on-gold:#121212;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--ink-2) 1px,transparent 1px),linear-gradient(90deg,var(--ink-2) 1px,transparent 1px);background-size:40px 40px;
  display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
.wrap{max-width:1520px;margin-inline:auto;padding-inline:24px;width:100%}
.top{border-bottom:1px solid var(--line);background:rgba(13,14,15,.88)}
.top .wrap{height:80px;display:flex;align-items:center}
.top img{height:56px;width:auto;display:block}
main{flex:1;display:flex;align-items:center;padding-block:80px}
.grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:64px;align-items:center}
.copy{display:flex;flex-direction:column}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;margin:0}
.eyebrow::before{content:"";width:24px;height:1px;background:var(--gold)}
h1{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(48px,7vw,112px);line-height:1.04;letter-spacing:.01em;margin:32px 0 0;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
p.lead{font-size:20px;color:var(--silver);max-width:520px;margin:16px 0 0;text-wrap:pretty}
.actions{display:flex;flex-wrap:wrap;gap:16px;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:12px;height:56px;padding-inline:28px;font-family:var(--f-mono);font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--gold);transition:background .2s,border-color .2s}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{background:var(--gold-hi);border-color:var(--gold-hi)}
.btn-ghost{border-color:var(--line)}
.btn-ghost:hover{border-color:var(--silver)}
.art{border:1px solid var(--line);background:var(--ink-2);padding:32px}
.art svg{width:100%;height:auto;display:block}
.code{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);display:flex;justify-content:space-between;border-top:1px solid var(--line);margin:24px -32px -32px;padding:12px 32px}
.code b{color:var(--gold);font-weight:500}
@media (max-width:960px){.grid{grid-template-columns:minmax(0,1fr);gap:48px}}
@media (max-width:640px){.wrap{padding-inline:16px}h1{font-size:44px;margin-top:24px}p.lead{font-size:18px}.actions .btn{flex:1 1 100%;justify-content:center}.art{padding:24px}.code{margin:24px -24px -24px;padding:12px 24px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><a href="/" aria-label="ZIP-MONT početna"><img src="/img/logo.png" alt="ZIP-MONT" width="480" height="295"></a></div></header>
<main>
  <div class="wrap grid">
    <div class="copy">
      <p class="eyebrow">Greška 404</p>
      <h1>Ovde nema <em>konstrukcije.</em></h1>
      <p class="lead">Stranica koju tražite ne postoji ili je premeštena. Proverite link ili se vratite na početnu stranu.</p>
      <div class="actions">
        <a href="/" class="btn btn-gold">Nazad na početnu <span aria-hidden="true">→</span></a>
        <a href="/#kontakt" class="btn btn-ghost">Kontakt</a>
      </div>
    </div>
    <div class="art" aria-hidden="true">
      <svg viewBox="0 0 480 300" fill="none">
        <path d="M24 260H456" stroke="var(--steel)"/>
        <path d="M40 260l-10 10M64 260l-10 10M416 260l-10 10M440 260l-10 10" stroke="var(--steel)" opacity=".5"/>
        <path d="M80 260V110" stroke="var(--gold)" stroke-width="4"/>
        <path d="M400 260V110" stroke="var(--gold)" stroke-width="4"/>
        <path d="M80 110L196 78" stroke="var(--gold)" stroke-width="4"/>
        <path d="M400 110L284 78" stroke="var(--gold)" stroke-width="4"/>
        <path d="M196 78l14 10M284 78l-14 10" stroke="var(--gold)" stroke-width="2"/>
        <path d="M222 70v28M258 70v28" stroke="var(--steel)" stroke-dasharray="4 4"/>
        <path d="M206 54H274M206 48v12M274 48v12" stroke="var(--steel)"/>
        <text x="240" y="40" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" letter-spacing="1" fill="var(--silver)">L = ?</text>
        <text x="240" y="180" text-anchor="middle" font-family="Big Shoulders Display, sans-serif" font-weight="800" font-size="104" fill="var(--line)">404</text>
      </svg>
      <div class="code"><span>Detalj <b>D-404</b></span><span>Element nedostaje</span></div>
    </div>
  </div>
</main>
</body>
</html>
